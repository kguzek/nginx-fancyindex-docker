name: Continuous Deployment

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

enable-openid-connect: true

jobs:
  push-to-registry:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: "${{ vars.REGISTRY_HOSTNAME }}/${{ vars.IMAGE_NAME }}"

      - name: Create Forgejo JWT
        id: jwt
        if: github.event_name != 'pull_request'
        run: |
          jwt=$( \
            curl --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${{ vars.OIDC_AUDIENCE }}" \
            | jq -r ".value" \
          )
          echo "::add-mask::$jwt"
          echo "jwt=$jwt" >> $FORGEJO_OUTPUT

      - name: Login to container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_HOSTNAME }}
          username: ${{ github.actor }}
          password: ${{ steps.jwt.outputs.jwt }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
